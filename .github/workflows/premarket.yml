name: Daily Premarket

on:
  schedule:
    - cron: '45 10 * * 1-5'  # 6:45 AM EDT (UTC-4, Mar–Nov)
    - cron: '45 11 * * 1-5'  # 6:45 AM EST (UTC-5, Nov–Mar)
  workflow_dispatch:

jobs:
  # Gate job: allow 5–11 AM NYC (covers cron + up to 5h GitHub delay),
  # then block if a scheduled run already succeeded today (prevents double-fire
  # from two crons). workflow_dispatch always bypasses both checks.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: NYC time gate + duplicate guard
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — always proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nyc_hour=$(TZ=America/New_York date +%-H)
          nyc_today=$(TZ=America/New_York date +%Y-%m-%d)
          echo "NYC: ${nyc_today} hour=${nyc_hour}"

          # Allow 5 AM–11 AM NYC. Covers 6:45 AM target + up to 5h GitHub delay.
          # Outside this window means a cron from a completely different day leaked through.
          if [ "$nyc_hour" -lt 5 ] || [ "$nyc_hour" -gt 11 ]; then
            echo "Outside 5–11 AM NYC window (hour=${nyc_hour}) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Block if another scheduled run already succeeded today (prevents double-run).
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --event schedule \
            --status success \
            --limit 10 \
            --json databaseId,createdAt > /tmp/runs.json

          prior=$(python3 -c "
import json, os
from datetime import datetime
from zoneinfo import ZoneInfo
runs = json.load(open('/tmp/runs.json'))
nyc = ZoneInfo('America/New_York')
today = datetime.now(nyc).strftime('%Y-%m-%d')
current = os.environ.get('GITHUB_RUN_ID', '')
prior = [r for r in runs
         if datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
              .astimezone(nyc).strftime('%Y-%m-%d') == today
         and str(r['databaseId']) != current]
print(len(prior))
")

          if [ "$prior" -gt "0" ]; then
            echo "Scheduled run already completed today — skipping duplicate."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "First scheduled run today, within window — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  premarket:
    needs: gate
    if: needs.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout market_watch
        uses: actions/checkout@v4
        with:
          path: repos/market_watch

      - name: Checkout src-core
        uses: actions/checkout@v4
        with:
          repository: jw-quant/src_core
          token: ${{ secrets.GH_PAT }}
          path: repos/src-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: repos/market_watch/requirements.txt

      - name: Install dependencies
        run: |
          pip install -e repos/src-core
          pip install -r repos/market_watch/requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Download data from OneDrive
        run: |
          mkdir -p repos/data
          rclone copy "onedrive:Desktop/repos/data" repos/data --transfers=8 -v

      - name: Run premarket.py
        working-directory: repos/market_watch
        env:
          DATA_ROOT: ${{ github.workspace }}/repos
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SMF_SMTP_USER: ${{ secrets.SMF_SMTP_USER }}
          SMF_SMTP_PASS: ${{ secrets.SMF_SMTP_PASS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python jobs/premarket.py

      - name: Rotate Schwab refresh token in GitHub Secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN=$(grep -oP '(?<=SCHWAB_REFRESH_TOKEN=).*' repos/market_watch/.env 2>/dev/null || true)
          if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "${{ secrets.SCHWAB_REFRESH_TOKEN }}" ]; then
            echo "Rotating Schwab refresh token in GitHub Secrets..."
            echo "$NEW_TOKEN" | gh secret set SCHWAB_REFRESH_TOKEN --repo jw-quant/market_watch
          else
            echo "Schwab refresh token unchanged or .env not written — skipping rotation."
          fi

      - name: Sync data back to OneDrive
        if: always()
        run: |
          rclone copy repos/data "onedrive:Desktop/repos/data" --transfers=8 -v
          rclone copy "repos/market_watch/data/reports" "onedrive:Desktop/repos/market_watch/data/reports" --transfers=8 -v

      - name: Upload reports as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-run-${{ github.run_number }}
          path: repos/market_watch/data/reports/
          retention-days: 14
